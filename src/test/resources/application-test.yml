spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:hrm_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,YEAR,MONTH,DAY,HOUR,MINUTE,SECOND,START,END,GROUP,VALUE,ORDER,KEY,STATUS,TYPE,NAME
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  hrm:
    seed:
      reference-enabled: true
      sample-enabled: true
      sample-key: HRM-TEST-SAMPLE
      sample-only-when-empty: true

api:
  prefix: api/
